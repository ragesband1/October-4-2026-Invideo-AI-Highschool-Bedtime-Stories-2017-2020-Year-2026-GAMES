<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invideo AI Highschool Bedtime Stories 2017-2020 Year 2026 GAMES</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0a0a12;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1400px;
      gap: 20px;
    }

    /* Flexbox / Grid Grid Container for Links */
    .links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-height: 400px;
      overflow-y: auto;
      padding: 15px;
      background: rgba(20, 20, 35, 0.8);
      border: 1px solid #ff007f;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
    }

    /* Neon Buttons Styling */
    .neon-btn {
      background: #121224;
      color: #00f3ff;
      border: 2px solid #00f3ff;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      flex: 1 1 280px;
      max-width: 320px;
      /* 2 Seconds Ease Animation Glow Effect */
      transition: all 2s ease;
      box-shadow: 0 0 5px rgba(0, 243, 255, 0.2);
    }

    .neon-btn:hover {
      color: #ffffff;
      background: #00f3ff;
      border-color: #ff007f;
      box-shadow: 0 0 20px #00f3ff, 0 0 40px #ff007f, 0 0 60px #ff007f;
      transform: translateY(-2px);
    }

    .neon-btn.active {
      background: #ff007f;
      color: #ffffff;
      border-color: #00f3ff;
      box-shadow: 0 0 15px #ff007f, 0 0 30px #00f3ff;
    }

    /* Preview Display Area */
    .preview-section {
      width: 100%;
      background: #121224;
      border: 2px solid #00f3ff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .active-title {
      font-size: 1.1rem;
      color: #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }

    .open-external {
      color: #00f3ff;
      text-decoration: none;
      font-size: 0.9rem;
      border: 1px solid #00f3ff;
      padding: 4px 10px;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .open-external:hover {
      background: #00f3ff;
      color: #000;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 8px;
      background: #ffffff;
    }

    /* Scrollbar Styling */
    .links-grid::-webkit-scrollbar {
      width: 8px;
    }
    .links-grid::-webkit-scrollbar-track {
      background: #0a0a12;
    }
    .links-grid::-webkit-scrollbar-thumb {
      background: #ff007f;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>Invideo AI Highschool Bedtime Stories 2017-2020 Year 2026 GAMES</h1>

  <div class="container">
    <!-- Buttons Grid -->
    <div class="links-grid" id="buttonsGrid"></div>

    <!-- Live Website Preview Display -->
    <div class="preview-section">
      <div class="preview-header">
        <span class="active-title" id="activeTitle">I-click ang kahit anong pamagat sa taas para mag-load ang game...</span>
        <a href="#" id="externalLink" target="_blank" class="open-external" style="display: none;">I-open sa Bagong Tab ↗</a>
      </div>
      <iframe id="webPreview" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    const linksData = [
      { title: "1. An Active And A Brave", url: "https://ragesband1.github.io/October-2-2026-1.-An-Active-And-A-Brave/" },
      { title: "2. The World Without Gold", url: "https://ragesband1.github.io/October-2-2026-2.-The-World-Without-Gold-/" },
      { title: "3. Trial And Error", url: "https://ragesband1.github.io/October-2-2026-3.-Trial-And-Error/" },
      { title: "4. A Severe Intention", url: "https://ragesband1.github.io/October-2-2026-4.-A-Severe-Intention/" },
      { title: "5. Serkaya A Psychiatrist", url: "https://ragesband1.github.io/October-2-2026-5.-Serkaya-A-Psychiatrist/" },
      { title: "6. Mafia Lyndon", url: "https://ragesband1.github.io/October-2-2026-6.-Mafia-Lyndon/" },
      { title: "7. The Persecution", url: "https://ragesband1.github.io/October-2-2026-7.-The-Persecution/" },
      { title: "8. The Legend Of Rock N Roll", url: "https://ragesband1.github.io/October-2-2026-8.-The-Legend-Of-Rock-N-Roll/" },
      { title: "9. The Martyrdom", url: "https://ragesband1.github.io/October-2-2026-9.-The-Martyrdom/" },
      { title: "10. The Piper For Hamilton - 3D Action RPG", url: "https://ragesband1.github.io/October-3-2026-10.-The-Piper-For-Hamilton---3D-Action-RPG/" },
      { title: "11. The Pretender", url: "https://ragesband1.github.io/October-3-2026-11.-The-Pretender/" },
      { title: "12. The Telephone Death - 3D RPG", url: "https://ragesband1.github.io/October-3-2026-12.-The-Telephone-Death---3D-RPG/" },
      { title: "13. Amos And Boris - 3D RPG Game", url: "https://ragesband1.github.io/October-3-2026-13.-Amos-And-Boris---3D-RPG-Game/" },
      { title: "14. The Eating Hair - 3D Action RPG", url: "https://ragesband1.github.io/October-3-2026-14.-The-Eating-Hair---3D-Action-RPG/" },
      { title: "15. With A Miracle - 3D Action RPG", url: "https://ragesband1.github.io/October-3-2026-15.-With-A-Miracle---3D-Action-RPG/" },
      { title: "16. The Bull Fight - 3D Action RPG", url: "https://ragesband1.github.io/October-3-2026-16.-The-Bull-Fight---3D-Action-RPG/" },
      { title: "17. The Human Aid", url: "https://ragesband1.github.io/October-3-2026-17.-The-Human-Aid/" },
      { title: "18. The Invisible Man - 3D Sci-Fi RPG", url: "https://ragesband1.github.io/October-3-2026-18.-The-Invisible-Man---3D-Sci-Fi-RPG/" },
      { title: "19. Welcome To The Black Parade", url: "https://ragesband1.github.io/October-3-2026-19.-Welcome-To-The-Black-Parade/" },
      { title: "20. The Curse Of Madress - 3D RPG", url: "https://ragesband1.github.io/October-3-2026-20.-The-Curse-Of-Madress---3D-RPG/" },
      { title: "21. Legend Of The Sea Horse - 3D RPG", url: "https://ragesband1.github.io/October-4-2026-21.-Legend-Of-The-Sea-Horse---3D-RPG/" },
      { title: "22. The Life Of Sandara Park - 3D RPG", url: "https://ragesband1.github.io/October-4-2026-22.-The-Life-Of-Sandara-Park---3D-RPG/" },
      { title: "23. Wake Me Up When September Ends - 3D Story RPG", url: "https://ragesband1.github.io/October-4-2026-23.-Wake-Me-Up-When-September-Ends---3D-Story-RPG/" },
      { title: "24. The Eye Of The Tiger - 3D Action RPG", url: "https://ragesband1.github.io/October-4-2026-24.-The-Eye-Of-The-Tiger---3D-Action-RPG/" },
      { title: "25. The Gulliver's Travel", url: "https://ragesband1.github.io/October-4-2026-25.-The-Gulliver-s-Travel/" },
      { title: "26. The Kangaroo Jack", url: "https://ragesband1.github.io/October-4-2026-26.-The-Kangaroo-Jack/" },
      { title: "27. Hawkeye Vs. Robinhood", url: "https://ragesband1.github.io/October-4-2026-27.-Hawkeye-Vs.-Robinhood/" }
    ];

    const grid = document.getElementById('buttonsGrid');
    const iframe = document.getElementById('webPreview');
    const activeTitle = document.getElementById('activeTitle');
    const externalLink = document.getElementById('externalLink');

    // Generate Neon Buttons
    linksData.forEach((item, index) => {
      const btn = document.createElement('button');
      btn.className = 'neon-btn';
      btn.textContent = item.title;
      
      btn.addEventListener('click', () => {
        // Update Iframe
        iframe.src = item.url;
        activeTitle.textContent = item.title;
        externalLink.href = item.url;
        externalLink.style.display = 'inline-block';

        // Toggle Active State
        document.querySelectorAll('.neon-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });

      grid.appendChild(btn);
    });

    // Automatically load the first game on start
    if(linksData.length > 0) {
      grid.children[0].click();
    }
  </script>
</body>
</html>
